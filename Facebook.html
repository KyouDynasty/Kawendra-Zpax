<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your custom CSS -->
    <script src="script.js" defer></script> <!-- Link to your custom JS for form validation and interactivity -->
</head>
<body>
    <div class="container">
        <div class="form-toggle">
            <button id="toggle-button">Switch to Signup</button>
        </div>
        <form id="login-form" class="form active">
            <h2>Login</h2>
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required aria-required="true" aria-describedby="login-email-desc">
            <span id="login-email-desc">Please enter your email address.</span>

            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required aria-required="true" aria-describedby="login-password-strength">
            <div id="login-password-strength">Password must be at least 8 characters, including upper/lowercase and numbers.</div>

            <button type="submit">Login</button>
        </form>
        <form id="signup-form" class="form">
            <h2>Signup</h2>
            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" required aria-required="true" aria-describedby="signup-email-desc">
            <span id="signup-email-desc">Please enter your email address.</span>

            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" required aria-required="true" aria-describedby="signup-password-strength">
            <div id="signup-password-strength">Password must be at least 8 characters, including upper/lowercase and numbers.</div>

            <button type="submit">Signup</button>
        </form>
    </div>
</body>
</html>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    color: #333;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 400px;
    margin: 50px auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
.form-toggle {
    display: flex;
    justify-content: space-between;
}
.form {
    display: none;
}
.form.active {
    display: block;
}
button {
    background: #5cb85c;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: #4cae4c;
}
</style>

<script>
document.getElementById('toggle-button').onclick = function() {
    var loginForm = document.getElementById('login-form');
    var signupForm = document.getElementById('signup-form');
    if (loginForm.classList.contains('active')) {
        loginForm.classList.remove('active');
        signupForm.classList.add('active');
        this.innerText = "Switch to Login";
    } else {
        signupForm.classList.remove('active');
        loginForm.classList.add('active');
        this.innerText = "Switch to Signup";
    }
};
</script>
